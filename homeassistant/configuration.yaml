# Marsriva MR-SPF6.5K-LP1-TL20E — Home Assistant configuration example
#
# Sensors are registered automatically via MQTT discovery when the container starts.
# They will appear in Home Assistant as sensor.marsriva_<field_name>.
#
# No manual sensor configuration is needed — the entries below are provided
# only as a reference showing what gets auto-discovered.
#
# Merge the relevant parts into your existing configuration.yaml if needed.

# Example: manually define a sensor (not required if MQTT discovery is enabled)
# mqtt:
#   sensor:
#     - name: "marsriva_bms_soc"
#       state_topic: "homeassistant/sensor/marsriva_bms_soc"
#       unit_of_measurement: "%"
#       icon: "mdi:battery-outline"

# ----- Auto-discovered sensors (sensor.marsriva_*) -----
#
# BMS Status (battery's reported view via CAN):
#   sensor.marsriva_bms_battery_voltage   (V)
#   sensor.marsriva_bms_battery_current   (A, + = charging / - = discharging)
#   sensor.marsriva_bms_battery_temp      (°C)
#   sensor.marsriva_bms_soc               (%)
#   sensor.marsriva_bms_max_charge_current (A)
#
# Battery — inverter's own measurement:
#   sensor.marsriva_battery_voltage       (V)
#   sensor.marsriva_battery_current       (A, signed)
#   sensor.marsriva_battery_remaining_kwh (kWh) [plausible — not confirmed]
#   sensor.marsriva_charging_active       (0 = idle, 2 = charging)
#
# AC Output:
#   sensor.marsriva_ac_out_voltage        (V)
#   sensor.marsriva_ac_out_frequency      (Hz)
#   sensor.marsriva_ac_out_current        (A)
#   sensor.marsriva_ac_out_power_factor   [plausible — not confirmed]
#   sensor.marsriva_inverter_output_power (W) [plausible]
#   sensor.marsriva_inverter_output_va    (VA) [plausible]
#   sensor.marsriva_inverter_energy_counter [plausible — approx kWh×100]
#
# Grid:
#   sensor.marsriva_grid_voltage          (V, 0 when grid disconnected)
#   sensor.marsriva_grid_power            (W, 0 when grid disconnected)
#   sensor.marsriva_grid_frequency        (Hz, 0 when grid disconnected)
#   sensor.marsriva_grid_energy_counter   [plausible — approx kWh×100]
#
# Identity:
#   sensor.marsriva_serial_number
